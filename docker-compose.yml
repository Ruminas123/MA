version: '3'

services:
  backend:
    build: ./backend
    container_name: ma_backend_container
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NETWORK_HOST=192.168.100.180
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=ma_project
      - DB_USER=postgres
      - DB_PASSWORD=abc@1234
  
  frontend:
    build: ./frontend
    container_name: ma_frontend_container 
    ports:
      - "4000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_DEV_SERVER_PORT=4000
      - VITE_API_URL=http://192.168.100.180:3000
    depends_on:
      - backend
